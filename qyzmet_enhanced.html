
<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Тапсырмалар менеджері</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>TaskFlow</h1>
            <button id="themeBtn">🌙</button>
        </header>

        <section class="welcome">
            <h2>Менің тапсырмаларым</h2>
            <p>Күніңді жоспарла және тапсырмаларыңды басқар!</p>
        </section>

        <section class="statistics">
            <div class="stat-card">
                <h3 id="totalTasks">0</h3>
                <p>Барлық тапсырма</p>
            </div>

            <div class="stat-card">
                <h3 id="completedTasks">0</h3>
                <p>Орындалған</p>
            </div>

            <div class="stat-card">
                <h3 id="pendingTasks">0</h3>
                <p>Орындалмаған</p>
            </div>
        </section>

        <section class="task-form">
            <h2>Жаңа тапсырма қосу</h2>

            <input type="text" id="taskInput"
                   placeholder="Тапсырма атауын енгізіңіз">

            <input type="date" id="taskDate">

            <select id="taskPriority">
                <option value="Орташа">Орташа</option>
                <option value="Жоғары">Жоғары</option>
                <option value="Төмен">Төмен</option>
            </select>

            <button id="addTaskBtn">+ Тапсырма қосу</button>
        </section>

        <section class="task-controls">

            <input type="text" id="searchInput"
                   placeholder="🔍 Тапсырманы іздеу...">

            <select id="filterTasks">
                <option value="all">Барлық тапсырма</option>
                <option value="completed">Орындалған</option>
                <option value="pending">Орындалмаған</option>
            </select>

        </section>

        <section>
            <h2>Тапсырмалар тізімі</h2>
            <div id="taskList"></div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
